<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — OKV Organization Management System</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --teal-950:#0a2420; --teal-800:#134a3d; --gold-500:#d6a13d; --gold-600:#b8862a; --ink:#1c2321; --ink-soft:#647069; }
*{box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif; color:var(--ink); margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px;
  background:radial-gradient(1200px 600px at 50% -10%, #133c33 0%, var(--teal-950) 55%, #071915 100%);}
h1{font-family:'Sora',sans-serif;}
.card-box{background:#fff; border-radius:18px; max-width:420px; width:100%; padding:32px 28px; box-shadow:0 30px 70px rgba(0,0,0,.4);}
.brand-mark{width:52px; height:52px; border-radius:14px; margin:0 auto 14px; background:linear-gradient(145deg, var(--gold-500), var(--gold-600));
  color:var(--teal-950); display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:800; font-size:.95rem; letter-spacing:-.2px;}
.card-box h1{font-size:1.2rem; font-weight:800; text-align:center; margin-bottom:4px;}
.card-box p.sub{font-size:.83rem; color:var(--ink-soft); text-align:center; margin-bottom:22px;}
.btn-teal{background:var(--teal-800); border-color:var(--teal-800); color:#fff;}
.form-label{font-size:.82rem; font-weight:600;}
#msg{font-size:.83rem; margin-top:10px;}
#invalidState{display:none; text-align:center;}
#invalidState i{font-size:2.4rem; color:#c0453b; margin-bottom:10px;}
</style>
</head>
<body>
<div class="card-box">
  <div class="brand-mark">OKV</div>
  <h1>Reset Your Password</h1>
  <p class="sub" id="subLine">Choose a new password for your account.</p>

  <form id="resetForm">
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" class="form-control" id="password" required minlength="8" autocomplete="new-password">
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input type="password" class="form-control" id="password2" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-teal w-100" id="resetBtn"><i class="bi bi-shield-lock me-1"></i>Reset Password</button>
    <div id="msg"></div>
  </form>

  <div id="invalidState">
    <i class="bi bi-exclamation-triangle"></i>
    <p style="font-size:.88rem; margin-bottom:16px;">This reset link is missing, invalid, or expired.</p>
    <a href="login.html" class="btn btn-outline-secondary btn-sm">Back to Log In</a>
  </div>
  <p class="text-center mt-3" style="font-size:.74rem; color:var(--ink-soft);">
    Need help? <span data-live-setting="ownerEmail">technologyokv@gmail.com</span> · <span data-live-setting="ownerPhone">+2348104141138</span> · <span data-live-setting="ownerWebsite">www.okvtechnology.com</span>
  </p>
</div>
<div style="text-align:center; margin-top:6px; font-size:.74rem; color:#9fc3b7;">
  <a href="privacy.html" style="color:#9fc3b7; margin:0 6px;">Privacy Policy</a>·
  <a href="terms.html" style="color:#9fc3b7; margin:0 6px;">Terms of Service</a>·
  <a href="refund-policy.html" style="color:#9fc3b7; margin:0 6px;">Refund Policy</a>
</div>


<script src="shared.js"></script>
<script>
applyLivePlatformSettings();
const token = new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('resetForm').style.display = 'none';
  document.getElementById('invalidState').style.display = 'block';
  document.getElementById('subLine').textContent = '';
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('resetBtn');
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  msg.className=''; msg.textContent='';

  if(password !== password2){ msg.className='text-danger'; msg.textContent='Passwords do not match.'; return; }
  if(!navigator.onLine){ msg.className='text-danger'; msg.textContent='Reconnect to the internet to reset your password.'; return; }

  btn.disabled = true; btn.textContent = 'Resetting…';
  try{
    const newPasswordHash = await sha256Hex(password);
    const res = await apiCall('resetPassword', { token, newPasswordHash });
    if(!res.success){
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('invalidState').style.display = 'block';
      document.getElementById('invalidState').querySelector('p').textContent = res.error || 'This reset link is invalid.';
      document.getElementById('subLine').textContent = '';
      return;
    }
    msg.className = 'text-success';
    msg.textContent = 'Password reset — redirecting to log in…';
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  }catch(err){
    msg.className = 'text-danger'; msg.textContent = 'Something went wrong. Please try again.';
    btn.disabled = false; btn.innerHTML = '<i class="bi bi-shield-lock me-1"></i>Reset Password';
  }
});
</script>
</body>
</html>
